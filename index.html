<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c1c1e">
<title>My Scientific Calc</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTXkgU2NpZW50aWZpYyBDYWxjIiwic2hvcnRfbmFtZSI6IkNhbGMiLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMWMxYzFlIiwidGhlbWVfY29sb3IiOiIjMWMxYzFlIiwiaWNvbnMiOlt7InNyYyI6Imh0dHBzOi8vY2RuLWljb25zLXBuZy5mbGF0aWNvbi5jb20vNTEyLzE1OTkvMTU5OTY0Mi5wbmcifV19">
<style>
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:sans-serif}
.calc{background:#1c1c1e;width:340px;border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.screen{background:#000;border-radius:16px;padding:20px;margin-bottom:15px;text-align:right;min-height:70px}
#history{color:#888;font-size:14px;min-height:18px;word-break:break-all}
#display{color:white;font-size:38px;font-weight:200;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:62px;border:none;border-radius:32px;font-size:18px;background:#333;color:white;font-weight:500}
button:active{opacity:.6}
.func{background:#a5a5a5;color:black;font-size:15px}
.op{background:#ff9f0a}
.equal{background:#ff9f0a;font-size:26px}
.install{background:#fff;color:#000;margin-top:15px;width:100%;height:50px;display:none}
</style>
</head>
<body>
<div class="calc">
  <div class="screen"><div id="history"></div><div id="display">0</div></div>
  <div class="keys">
    <button onclick="clearAll()">AC</button><button onclick="del()">DEL</button><button onclick="add('(')">(</button><button onclick="add(')')">)</button>
    <button class="func" onclick="add('Math.sqrt(')">√</button><button class="func" onclick="add('**')">xʸ</button><button class="func" onclick="add('Math.sin(')">sin</button><button class="func" onclick="add('Math.cos(')">cos</button>
    <button class="func" onclick="add('Math.tan(')">tan</button><button class="func" onclick="add('Math.log10(')">log</button><button class="func" onclick="add('Math.log(')">ln</button><button class="func" onclick="add('Math.PI')">π</button>
    <button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('/')">÷</button>
    <button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('*')">×</button>
    <button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op" onclick="add('-')">−</button>
    <button onclick="add('0')">0</button><button onclick="add('.')">.</button><button class="equal" onclick="calculate()">=</button><button class="op" onclick="add('+')">+</button>
  </div>
  <button id="installBtn" class="install">📲 Install App</button>
</div>
<script>
let expr="";function add(v){expr+=v;document.getElementById('history').innerText=expr;document.getElementById('display').innerText=expr.slice(-12)||"0"}function clearAll(){expr="";document.getElementById('display').innerText="0";document.getElementById('history').innerText=""}function del(){expr=expr.slice(0,-1);document.getElementById('history').innerText=expr;document.getElementById('display').innerText=expr||"0"}function calculate(){try{let r=eval(expr);document.getElementById('display').innerText=r;document.getElementById('history').innerText=expr+" =";expr=String(r)}catch{document.getElementById('display').innerText="Error"}}

// PWA Install
let deferredPrompt; const btn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.style.display='block'});
btn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.style.display='none'}});
if('serviceWorker' in navigator){navigator.serviceWorker.register(URL.createObjectURL(new Blob(["self.addEventListener('fetch',e=>e.respondWith(fetch(e.request)))"],{type:'text/javascript'})))}
</script>
</body>
  </html>
